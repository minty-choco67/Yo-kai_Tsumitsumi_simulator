/* ---------- janken (slot reels) ---------- */
const HANDS = [{ k: 'gu', label: 'グー' }, { k: 'choki', label: 'チョキ' }, { k: 'pa', label: 'パー' }];
const handSVG = i => `<svg viewBox="0 0 48 48" aria-hidden="true"><use href="#h-${HANDS[i].k}"/></svg>`;
function reelFace(el, i, stepMs) {
  el.innerHTML = `<span class="face${stepMs ? ' step' : ''}" style="--st:${stepMs || 0}ms">${handSVG(i)}<b>${HANDS[i].label}</b></span>`;
}
async function spinReel(el, final, total, tick) {
  const steps = [];
  for (let t = 0, iv = 48; t + iv <= total; t += iv, iv *= 1.15) steps.push(iv);
  if (reduced) steps.length = 0;
  let idx = ((final - steps.length) % 3 + 3) % 3;
  reelFace(el, idx);
  for (let i = 0; i < steps.length; i++) {
    await sleep(steps[i]);
    idx = (idx + 1) % 3;
    reelFace(el, idx, Math.round(Math.min(steps[i], 150)));
    if (tick && i < steps.length - 1) Sound.tick(i / steps.length);
  }
  Sound.stop();
}
// exactly 50% each way and never あいこ: decide the winner first, then show a pair of hands that gives it
function pickJanken(rand = Math.random) {
  const youWin = rand() < 0.5;
  const me = Math.floor(rand() * 3);
  const cpu = youWin ? (me + 1) % 3 : (me + 2) % 3;   // グー > チョキ > パー > グー
  return { youWin, me, cpu };
}
function janken() {
  return new Promise(resolve => {
    const { youWin, me, cpu } = pickJanken();
    openDialog(`<h2>じゃんけんで先攻を決めます</h2>
      <p class="jkmsg" id="jkMsg" aria-live="polite">じゃん、けん…</p>
      <div class="reels">
        <figure class="reel you"><figcaption>あなた</figcaption><div class="win" id="reelYou"><span class="q">？</span></div></figure>
        <span class="vs" aria-hidden="true">対</span>
        <figure class="reel cpu"><figcaption>CPU</figcaption><div class="win" id="reelCpu"><span class="q">？</span></div></figure>
      </div>
      <p class="note">勝ったほうが先攻です。</p>`, () => {});
    dlg._noEsc = true;                            // it runs by itself; nothing to cancel midway
    (async () => {
      const ry = $('#reelYou'), rc = $('#reelCpu'), msg = $('#jkMsg');
      await sleep(reduced ? 0 : 250);
      await Promise.all([spinReel(ry, me, 950, false), spinReel(rc, cpu, 1550, true)]);
      (youWin ? ry : rc).classList.add('won');
      (youWin ? rc : ry).classList.add('lost');
      if (youWin) Sound.jkWin(); else Sound.jkLose();
      msg.textContent = `ぽん！${youWin ? 'あなたの勝ち' : 'CPUの勝ち'}`;
      await sleep(reduced ? 500 : 1300);
      dlg._noEsc = false;
      closeDialog();
      resolve({ first: youWin ? HUMAN : CPU, me, cpu });
    })();
  });
}

/* ---------- big 先攻 / 後攻 stamp ---------- */
function showOrderBanner(first) {
  return new Promise(resolve => {
    const el = $('#banner');
    const mine = first === HUMAN;
    el.className = 'banner ' + (mine ? 'you' : 'cpu');
    el.innerHTML = `<div class="stamp"><b>${mine ? '先攻' : '後攻'}</b><span>${mine ? 'あなたが先に動きます' : 'CPUが先に動きます'}</span></div>`;
    el.hidden = false;
    Sound.order(mine);
    let done = false;
    const key = e => { if (['Escape', 'Enter', ' '].includes(e.key)) { e.preventDefault(); finish(); } };
    function finish() {
      if (done) return;
      done = true;
      document.removeEventListener('keydown', key, true);
      el.classList.add('out');
      setTimeout(() => { el.hidden = true; el.classList.remove('out'); el.onclick = null; resolve(); }, reduced ? 0 : 280);
    }
    el.onclick = finish;
    document.addEventListener('keydown', key, true);
    setTimeout(finish, 1800);
  });
}

/* ---------- game flow ---------- */
let startSeq = 0;
async function startGame() {
  closeDialog();
  const seqNo = ++startSeq;
  const you = settings.deck, cpu = you === 'A' ? 'B' : 'A';
  let first, jk = null;
  if (settings.first === 'random') {
    jk = await janken();
    if (!jk || seqNo !== startSeq) return;
    first = jk.first;
  } else {
    first = settings.first === 'you' ? HUMAN : CPU;
  }
  g = T.newGame({ decks: [you, cpu], first });
  g.level = settings.level;
  const game = g;
  setupOpen = false; busy = true; logs = []; ui = { sel: null, hover: null, variant: 'normal', pick: null, dice: null };
  const how = jk ? `じゃんけん（あなた：${HANDS[jk.me].label}、CPU：${HANDS[jk.cpu].label}）で` : '';
  log(null, `対戦開始：あなた＝${T.DECKS[you].name}、CPU＝${T.DECKS[cpu].name}（${LEVEL_NAME[settings.level]}）。${how}${WHO(first)}が先攻。`);
  const drawn = T.startTurn(g);
  log(first, drawText(drawn.length));
  $('#layer').innerHTML = '';
  render();
  await showOrderBanner(first);
  if (game !== g || seqNo !== startSeq) return;
  busy = false;
  if (g.cur === CPU) cpuTurn(); else render();
}
async function endHumanTurn() {
  if (g.active) T.finishAct(g, g.active);
  ui.sel = null; ui.variant = 'normal';
  const drawn = T.endTurn(g);
  if (g.winner != null) { gameOver(); return; }
  log(CPU, drawText(drawn.length));
  cpuTurn();
}
async function cpuTurn() {
  busy = true;
  const game = g;
  render();
  await sleep(reduced ? 150 : SPEED[settings.speed] * 0.7);
  try { await T.cpuTurn(game, makeIO(game), CPU, game.level || 'normal'); }
  catch (err) { console.error(err); log(null, 'CPUの手番でエラーが起きたので、ターンを終えました'); }
  if (game !== g) return;
  busy = false;
  if (g.winner != null) { gameOver(); return; }
  const drawn = T.endTurn(g);
  if (g.winner != null) { gameOver(); return; }
  log(HUMAN, drawText(drawn.length));
  ui.sel = null;
  Sound.turn();
  render();
}
function gameOver() {
  busy = false; ui.pick = null;
  const w = g.winner;
  const reason = g.reason === 'king' ? `${w === HUMAN ? 'CPU' : 'あなた'}の王将を3枚すべて倒しました。`
    : g.reason === 'ko' ? `${w === HUMAN ? 'CPU' : 'あなた'}の気絶が6体になりました。`
    : `${T.TURN_LIMIT}ターンに達したので、王将ののこり枚数（同じなら気絶の少なさ）で判定しました。`;
  log(null, w === 2 ? '引き分け' : `${WHO(w)}の勝ち：${reason}`);
  setTimeout(() => (w === HUMAN ? Sound.win() : Sound.lose()), 650);
  render();
  openDialog(`<h2>${w === 2 ? '引き分け' : w === HUMAN ? 'あなたの勝ち！' : 'CPUの勝ち'}</h2><p>${reason}</p><p>${g.turn}ターンで決着。王将のこり あなた${g.players[HUMAN].kings.length}・CPU${g.players[CPU].kings.length}、気絶 あなた${g.players[HUMAN].ko.length}・CPU${g.players[CPU].ko.length}。</p>
    <div class="row"><button class="btn" type="button" data-d="setup">設定を変える</button><button class="btn" type="button" data-d="close">盤面を見る</button><button class="btn main" type="button" data-d="again">もう一度</button></div>`,
  act => { closeDialog(); if (act === 'again') startGame(); else if (act === 'setup') { setupOpen = true; render(); } });
  $('#dlgBody').classList.add('over');
}

function showRules() {
  const rows = (k) => T.DECKS[k].yokai.map(no => { const c = T.CARDS[no]; return `<tr><td>${c.no.slice(0, 3)}</td><td>${esc(c.name)}</td><td>${c.lv}</td><td>${T.MOVE_NAME[c.mv.t]}${c.mv.n}</td><td>${c.skills.map(s => T.SKILLS[s].name).concat(c.sp ? [`必殺「${T.SPECIALS[c.sp].name}」`] : []).join('、')}${c.from ? `（${esc(c.from)}から成る）` : ''}</td></tr>`; }).join('') +
    T.DECKS[k].kings.map(no => { const kk = T.KINGS[no]; return `<tr><td>王</td><td>王将</td><td>－</td><td>－</td><td>「${kk.name}」${kk.text}</td></tr>`; }).join('');
  openDialog(`<h2>ルール</h2><div class="rules">
    <h3>勝ち方</h3><ul><li>相手の王将を3枚すべて倒す。</li><li>または、相手の気絶置場の駒を6体にする。</li></ul>
    <h3>盤と準備</h3><ul><li>盤はたて5×よこ3。いちばん手前の列のまん中が王将（3枚重ね、裏向き）、その左右が出陣マス。</li><li>デッキ12枚をシャッフルし、2枚引いてスタート。手元の駒はおたがいに見えます。</li></ul>
    <h3>ターンの流れ</h3><ul><li>はじめに山札から2枚引く（山札がなくなったら引かない）。</li><li>出陣フェイズ：手元の妖怪を、レベルの数だけ駒をつんであいている出陣マスに出す。つんだ枚数がHP。「成り」できる妖怪は、場の成り元の上にレベルに関係なく1枚重ねる（HPは1増える。手元から追加でつむ必要はない）。</li><li>同じ名前の駒は、自分の場に1体まで（気絶したら同じ名前の駒をまた出せる）。</li><li>出陣マスが2つとも敵の駒で埋まっているときだけ、2列目のあいているマスが「臨時の出陣マス」になる。2列目も敵で埋まっていると、ふつうの出陣はできない。</li><li>行動フェイズ：自分の駒は1体ずつ「移動」と「攻撃」を1回ずつ（順番は自由、しなくてもOK）。出したばかりの駒もすぐ行動できる。</li></ul>
    <h3>移動</h3><ul><li>歩：たて・よこ（ななめは2歩）。駒は飛び越えられない。</li><li>斜：ななめも1歩。飛び越えはできない。</li><li>飛：駒を飛び越えられる。駒のいるマスには止まれない。</li></ul>
    <h3>攻撃</h3><ul><li>ふつうはたて・よこのとなり。攻撃側だけがダイスをふり、「攻撃レベル＋出目」が相手のレベル以上なら成功で1ダメージ。</li><li>クリティカルは必ず成功してダメージ＋1、さぼるは必ず失敗。</li><li>ダメージ1につき、つんでいる駒を1枚手元にもどす。HPが0になると気絶（いちばん上の駒が気絶置場へ、残りは手元へ）。</li><li>必殺技は、つんでいる駒を指定枚数手元にもどして使う（1ターンに1回、気絶する払い方はできない）。</li></ul>
    <h3>王手</h3><ul><li>王将への攻撃は「さぼる」以外なら成功し、1回で1枚倒す。スキルや必殺技は効かない（射程2・ななめ攻撃で届く場合は攻撃できる）。</li><li>倒した王将を表にして効果を使う。倒された王将は持ち主の手元に入り、つむ駒として使える。</li></ul>
    <h3>この版での解釈</h3><ul><li>「成り」「同名の駒」「臨時の出陣マス」は公式マニュアルの記載どおりです。それ以外は、ファンのレビューとプレイ記、スタートパック全駒の英訳をもとに再現しています。</li><li>ダメージで手元にもどす駒・回復に使う駒は自動でえらびます（もどすのは強い妖怪から、つむのは王将や低レベルから）。</li><li>必殺技名は英訳からの再現です。「周囲1ダメ」は王将のまわり8マス、「射程2」はたて・よこ2マス先までとしています。</li><li>${T.TURN_LIMIT}ターンで決着がつかないときは王将の残り、次に気絶の少なさで判定します。</li></ul>
